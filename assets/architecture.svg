<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="aa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Open Agents Cowork Platform — 系统架构图</text>

  <!-- Control Plane -->
  <rect x="60" y="60" width="180" height="90" rx="8" fill="url(#cp)" filter="url(#glow)"/>
  <text x="150" y="92" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Control Plane</text>
  <text x="150" y="110" text-anchor="middle" fill="#b3e0c0" font-size="11">控制平面</text>
  <text x="150" y="130" text-anchor="middle" fill="#d2e8d9" font-size="10">Runtime 注册 · 心跳</text>
  <text x="150" y="144" text-anchor="middle" fill="#d2e8d9" font-size="10">任务编排 · 能力调度</text>

  <!-- Dashboard -->
  <rect x="60" y="175" width="180" height="70" rx="8" fill="url(#db)" filter="url(#glow)"/>
  <text x="150" y="205" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Dashboard (SPA)</text>
  <text x="150" y="225" text-anchor="middle" fill="#d4c0f0" font-size="11">Web 仪表盘 · 三语界面</text>

  <!-- Agent Manager -->
  <rect x="60" y="270" width="180" height="70" rx="8" fill="url(#cp)" filter="url(#glow)"/>
  <text x="150" y="300" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Agent Manager</text>
  <text x="150" y="320" text-anchor="middle" fill="#b3e0c0" font-size="11">自动发现 · 进程管理</text>

  <!-- Arrow: CP to Dashboard -->
  <line x1="150" y1="150" x2="150" y2="175" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="150,177 146,170 154,170" fill="#58a6ff"/>

  <!-- Arrow: CP to Agent Mgr -->
  <line x1="150" y1="245" x2="150" y2="270" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="150,272 146,265 154,265" fill="#58a6ff"/>

  <!-- A2A Protocol -->
  <rect x="310" y="60" width="180" height="110" rx="8" fill="url(#aa)" filter="url(#glow)"/>
  <text x="400" y="88" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">A2A 协议层</text>
  <text x="400" y="106" text-anchor="middle" fill="#b3d1f5" font-size="11">Google Agent-to-Agent</text>
  <line x1="330" y1="118" x2="470" y2="118" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="400" y="135" text-anchor="middle" fill="#d0e0f5" font-size="10">agent/getCard · message/send</text>
  <text x="400" y="150" text-anchor="middle" fill="#d0e0f5" font-size="10">tasks/get · JSON-RPC 2.0</text>
  <text x="400" y="165" text-anchor="middle" fill="#d0e0f5" font-size="10">HTTP · x-platform-token</text>

  <!-- Scheduler -->
  <rect x="310" y="195" width="180" height="75" rx="8" fill="url(#ai)" filter="url(#glow)"/>
  <text x="400" y="222" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">能力感知调度器</text>
  <text x="400" y="242" text-anchor="middle" fill="#f5e6c0" font-size="11">Capability-Aware Scheduler</text>
  <text x="400" y="258" text-anchor="middle" fill="#f5e6c0" font-size="10">评分矩阵 · 最优匹配</text>

  <!-- Agent Adapters -->
  <rect x="310" y="295" width="180" height="100" rx="8" fill="url(#aa)" filter="url(#glow)"/>
  <text x="400" y="320" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Agent Adapters</text>
  <text x="400" y="340" text-anchor="middle" fill="#b3d1f5" font-size="11">桥接层: A2A ↔ 后端</text>
  <text x="400" y="360" text-anchor="middle" fill="#d0e0f5" font-size="10">Stdio | OpenAI | Claude | Codex</text>
  <text x="400" y="378" text-anchor="middle" fill="#d0e0f5" font-size="10">自动注册 · 心跳维持</text>

  <!-- Workflow Orchestrator -->
  <rect x="560" y="60" width="180" height="220" rx="8" fill="url(#ai)" filter="url(#glow)"/>
  <text x="650" y="90" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">工作流编排器</text>
  <text x="650" y="108" text-anchor="middle" fill="#f5e6c0" font-size="11">Workflow Orchestrator</text>

  <!-- Pipeline stages -->
  <rect x="580" y="125" width="140" height="36" rx="6" fill="#1c2128" stroke="#d29922" stroke-width="1"/>
  <text x="650" y="148" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">① Plan 规划</text>

  <line x1="650" y1="161" x2="650" y2="171" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="650,173 646,167 654,167" fill="#58a6ff"/>

  <rect x="580" y="175" width="140" height="36" rx="6" fill="#1c2128" stroke="#d29922" stroke-width="1"/>
  <text x="650" y="198" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">② Execute 执行</text>

  <line x1="650" y1="211" x2="650" y2="221" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="650,223 646,217 654,217" fill="#58a6ff"/>

  <rect x="580" y="225" width="140" height="36" rx="6" fill="#1c2128" stroke="#d29922" stroke-width="1"/>
  <text x="650" y="248" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">③ Synthesize 综合</text>

  <text x="650" y="275" text-anchor="middle" fill="#f5e6c0" font-size="10">SSE 实时推送状态</text>

  <!-- AI Runtimes at bottom -->
  <rect x="560" y="310" width="180" height="85" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="650" y="335" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">AI Runtime 节点</text>
  <text x="650" y="355" text-anchor="middle" fill="#8b949e" font-size="10">Claude Code · OpenCode · Ollama</text>
  <text x="650" y="372" text-anchor="middle" fill="#8b949e" font-size="10">Copilot CLI · 任意 OpenAI API</text>

  <!-- Connection lines -->
  <line x1="240" y1="105" x2="310" y2="105" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="308,105 302,101 302,109" fill="#58a6ff"/>

  <line x1="240" y1="230" x2="310" y2="230" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="308,230 302,226 302,234" fill="#58a6ff"/>

  <line x1="240" y1="305" x2="310" y2="305" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="308,305 302,301 302,309" fill="#58a6ff"/>

  <line x1="490" y1="105" x2="560" y2="105" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="558,105 552,101 552,109" fill="#58a6ff"/>

  <line x1="490" y1="230" x2="560" y2="230" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="558,230 552,226 552,234" fill="#58a6ff"/>

  <!-- Auto-detect box -->
  <rect x="310" y="420" width="430" height="80" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="525" y="444" text-anchor="middle" fill="#8b949e" font-size="12">🔄 自动发现 (Auto-Detect)</text>
  <text x="525" y="464" text-anchor="middle" fill="#6e7681" font-size="10">扫描 PATH · npm · Homebrew → 发现已安装的 AI 工具</text>
  <text x="525" y="484" text-anchor="middle" fill="#6e7681" font-size="10">用户勾选 → 一键添加 → Launch 启动 → 自动注册</text>

  <!-- Legend -->
  <rect x="60" y="420" width="200" height="80" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="0.5"/>
  <rect x="75" y="436" width="12" height="12" rx="2" fill="#238636"/>
  <text x="92" y="446" fill="#8b949e" font-size="10">控制 / Agent 管理</text>
  <rect x="75" y="456" width="12" height="12" rx="2" fill="#1f6feb"/>
  <text x="92" y="466" fill="#8b949e" font-size="10">A2A 协议通信</text>
  <rect x="75" y="476" width="12" height="12" rx="2" fill="#d29922"/>
  <text x="92" y="486" fill="#8b949e" font-size="10">调度 / 编排</text>
</svg>